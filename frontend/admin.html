<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard | EventSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/html5-qrcode" defer></script>
</head>
<body class="admin-page">

<div class="app-shell">
    <header class="topbar">
        <div>
            <p class="eyebrow">EventSphere</p>
            <h1>Admin Dashboard</h1>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <section class="profile-card modern-card" id="profileCard"></section>

    <section class="section-block">
        <div class="section-header">
            <div>
                <p class="eyebrow">Overview</p>
                <h2>Analytics Dashboard</h2>
            </div>
        </div>
        <div class="stats-grid" id="analytics"></div>
    </section>

    <section class="scanner-wrap modern-card">
        <div class="scanner-head">
            <div>
                <p class="eyebrow">Entry Management</p>
                <h2>QR Check-In Scanner</h2>
            </div>
            <div class="scanner-actions">
                <button type="button" class="secondary-btn" onclick="startScanner()">Start Scanner</button>
                <button type="button" class="danger-btn" onclick="stopScanner()">Stop Scanner</button>
            </div>
        </div>

        <div class="scanner-grid">
            <div class="scanner-box">
                <div id="reader"></div>
            </div>
            <div class="scan-result" id="scanResult">
                <h3>Scan Result</h3>
                <p>No QR scanned yet.</p>
            </div>
        </div>
    </section>

    <section class="modern-card form-card">
        <div class="section-header">
            <div>
                <p class="eyebrow">Manage Events</p>
                <h2 id="formTitle">Create New Event</h2>
            </div>
        </div>

        <input type="hidden" id="eventId">

        <div class="form-grid">
            <div class="form-col">
                <label>Event Name</label>
                <input type="text" id="name" placeholder="Enter event name">
            </div>

            <div class="form-col">
                <label>Venue</label>
                <input type="text" id="venue" placeholder="Enter venue">
            </div>

            <div class="form-col">
                <label>Date</label>
                <input type="date" id="date">
            </div>

            <div class="form-col">
                <label>Total Tickets</label>
                <input type="number" id="totalTickets" placeholder="Enter total tickets">
            </div>

            <div class="form-col">
                <label>Category</label>
                <select id="category">
                    <option value="Technical">Technical</option>
                    <option value="Cultural">Cultural</option>
                    <option value="Sports">Sports</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Seminar">Seminar</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-col">
                <label>Poster</label>
                <input type="file" id="poster" accept="image/*">
            </div>

            <div class="form-col full">
                <label>Description</label>
                <textarea id="description" placeholder="Write event description"></textarea>
            </div>
        </div>

        <div class="action-row">
            <button onclick="saveEvent()">Save Event</button>
            <button type="button" class="secondary-btn" onclick="resetForm()">Reset</button>
        </div>
    </section>

    <section class="modern-card">
        <div class="section-header compact">
            <div>
                <p class="eyebrow">Search</p>
                <h2>All Events</h2>
            </div>
        </div>

        <div class="filter-bar modern-filter">
            <input type="text" id="searchInput" placeholder="Search by event, venue, category">
            <select id="filterCategory">
                <option value="">All Categories</option>
                <option value="Technical">Technical</option>
                <option value="Cultural">Cultural</option>
                <option value="Sports">Sports</option>
                <option value="Workshop">Workshop</option>
                <option value="Seminar">Seminar</option>
                <option value="Other">Other</option>
            </select>
            <button onclick="fetchEvents()">Search</button>
        </div>

        <div id="events" class="grid cards-grid"></div>
    </section>
</div>

<div id="toastBox" class="toast-box"></div>
<script src="js/admin.js"></script>
</body>
</html>
